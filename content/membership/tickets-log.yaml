# Journal manuel et ANONYME des sollicitations Membership traitées sur Discord.
#
# IMPORTANT — aucune donnée personnelle : uniquement le pôle concerné et des
# horodatages. Pas de nom, pas de CID, pas de contenu de message. Ce journal
# sert à produire des statistiques publiques par pôle (page Point vACC), en
# attendant l'accord pour un lien automatique avec Discord.
#
# Rempli à la main. Validé par `npm run validate` (ids uniques, chronologie).
# Champs : id (unique), department (un pôle de src/config/departments.ts),
# opened (obligatoire), first_response (optionnel), closed (optionnel = encore
# ouvert si absent), outcome (optionnel : resolved | redirected | no_response | other).
# Horodatages au format ISO 8601 avec fuseau, ex. 2026-06-01T18:30:00Z.
#
# Les entrées dont l'id commence par « exemple- » sont des exemples livrés avec
# la plateforme : la page affiche alors un badge EXEMPLE. Les remplacer par de
# vraies entrées fait disparaître le badge.

